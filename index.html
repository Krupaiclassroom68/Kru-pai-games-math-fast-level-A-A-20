<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เกมคณิตคิดเร็ว Level 2 — Kru Pai Classroom</title>
<style>
  :root{
    --bg:#fff9fb;
    --primary:#e11d48;
    --primary-dark:#be123c;
    --accent:#f59e0b;
    --ink:#111827;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif}
  .wrap{min-height:100svh;display:grid;place-items:center;padding:16px}
  .card{width:min(900px,100%);background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.12);overflow:hidden;border:4px solid var(--primary)}
  .header{display:flex;gap:12px;align-items:center;padding:14px 18px;background:linear-gradient(90deg,var(--primary),var(--primary-dark));color:#fff}
  .logo{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--primary);display:grid;place-items:center;font-weight:800}
  .title{font-size:clamp(18px,2.2vw,24px);font-weight:800}
  .subtitle{opacity:.9;font-size:clamp(13px,1.8vw,15px)}

  .timer{position:relative;height:16px;border-radius:999px;background:#ffe4e6;overflow:hidden;border:2px solid #fecdd3;margin:10px 0 6px}
  .bar{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,var(--accent),#f97316);transform-origin:left center}
  .time-row{display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .pill{background:#fff1f2;color:var(--primary-dark);padding:6px 10px;border-radius:999px;border:2px solid #fecdd3;font-size:18px}

  .qbox{margin:8px 0 14px;text-align:center;position:relative}
  .qtext{font-size:clamp(28px,7vw,56px);font-weight:900}
  .emoji-front{position:absolute;left:5%;top:-10px;font-size:48px;animation:pop .4s ease;}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .btn{font-size:clamp(20px,4.2vw,26px);font-weight:800;border:none;border-radius:16px;padding:16px 14px;background:#fff;border:3px solid #ffd1dc;box-shadow:0 6px 0 #fecdd3;transition:transform .08s ease, box-shadow .08s ease}
  .btn:active{transform:translateY(2px);box-shadow:0 4px 0 #fecdd3}
  .btn.correct{background:#ecfdf5;border-color:#bbf7d0;box-shadow:0 6px 0 #86efac}
  .btn.wrong{background:#fef2f2;border-color:#fecaca;box-shadow:0 6px 0 #fca5a5}

  .score-big{font-size:40px;font-weight:900;color:var(--primary-dark)}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  .badge{background:#fff;border:2px solid #fce7f3;padding:8px 12px;border-radius:12px;font-weight:800}

  .screen{display:none}
  .screen.active{display:block}
  .center{display:grid;place-items:center;text-align:center;gap:14px;padding:28px}
  .start-title{font-size:clamp(24px,6vw,44px);font-weight:900;color:var(--primary)}
  .big-name{font-size:clamp(36px,7vw,70px);font-weight:900;color:var(--primary-dark)}
  .big{font-size:clamp(32px,7vw,64px);font-weight:900}
  .lead{opacity:.85;font-size:22px}
  .cta{background:var(--primary);color:#fff;border:none;border-radius:999px;padding:14px 22px;font-size:clamp(18px,4vw,22px);font-weight:900;box-shadow:0 10px 22px rgba(225,29,72,.35)}

  .confetti{pointer-events:none;position:fixed;inset:0;overflow:hidden}
  .confetti i{position:absolute;width:8px;height:14px;background:var(--accent);top:-10px;animation:fall 900ms linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app">
    <div class="header">
      <div class="logo">π</div>
      <div>
        <div class="title">Kru Pai Classroom • เกมคณิตคิดเร็ว ป.4</div>
        <div class="subtitle">Level 2 — บวก ลบ คูณ หาร | จับเวลาข้อละ 15 วิ</div>
      </div>
    </div>

    <section class="screen active" id="start">
      <div class="center">
        <div class="start-title">กรอกชื่อก่อนเริ่มเกม 💡</div>
        <input id="playerName" placeholder="ชื่อเล่นของคุณ" style="padding:10px 14px;font-size:18px;border:2px solid #fecdd3;border-radius:10px;">
        <button class="cta" id="btnStart">เริ่มเกม!</button>
      </div>
    </section>

    <section class="screen" id="game">
      <div class="body">
        <div class="time-row">
          <div class="pill">ข้อ <span id="qIndex">1</span>/20</div>
          <div class="pill score-big">คะแนน: <span id="score">0</span></div>
          <div class="pill">⏱ <span id="sec">15</span>s</div>
        </div>
        <div class="timer"><div class="bar" id="bar"></div></div>
        <div class="qbox">
          <div class="emoji-front" id="emojiFront"></div>
          <div class="qtext" id="qText">45 + 55 − 90 = ?</div>
        </div>
        <div class="grid" id="options"></div>
      </div>
    </section>

    <section class="screen" id="result">
      <div class="center">
        <div class="big-name" id="playerDisplay">Player</div>
        <div class="big" id="finalScore">0/20</div>
        <div class="lead" id="finalMsg">ว้าว! สุดปัง ปัง ปัง 🚀</div>
        <button class="cta" id="btnReplay">เล่นอีกครั้ง</button>
      </div>
    </section>
  </div>
</div>
<div class="confetti" id="fx"></div>
<script>
const QUESTIONS=[
 {q:"45 + 55 - 90 = ?",a:10},
 {q:"25 × 4 + 50 = ?",a:150},
 {q:"100 ÷ 25 × 20 = ?",a:80},
 {q:"5000 × 3 = ?",a:15000},
 {q:"1000 × 19 = ?",a:19000},
 {q:"80 + 120 - 100 = ?",a:100},
 {q:"35 × 5 = ?",a:175},
 {q:"64 ÷ 8 + 16 = ?",a:24},
 {q:"90 + 60 ÷ 3 = ?",a:110},
 {q:"400 - 150 + 50 = ?",a:300},
 {q:"12 × 12 - 44 = ?",a:100},
 {q:"500 ÷ 5 + 20 = ?",a:120},
 {q:"300 ÷ 10 × 5 = ?",a:150},
 {q:"80 + 25 × 2 = ?",a:130},
 {q:"100 × 7 - 200 = ?",a:500},
 {q:"40 × 9 ÷ 6 = ?",a:60},
 {q:"900 ÷ 30 + 5 = ?",a:35},
 {q:"2000 ÷ 4 + 500 = ?",a:1000},
 {q:"45 + 55 + 100 = ?",a:200},
 {q:"50 × 5 - 100 = ?",a:150}
];
let order=[],idx=0,score=0,timer=null,timeLeft=15,playerName="";
const $=s=>document.querySelector(s);
const startScreen=$('#start'),gameScreen=$('#game'),resultScreen=$('#result');
const qIndex=$('#qIndex'),qText=$('#qText'),options=$('#options'),scoreEl=$('#score'),secEl=$('#sec'),barEl=$('#bar'),fxEl=$('#fx'),finalScore=$('#finalScore'),finalMsg=$('#finalMsg'),emojiFront=$('#emojiFront'),playerDisplay=$('#playerDisplay');
const shuffle=a=>a.sort(()=>Math.random()-.5);
function makeChoices(ans){const s=new Set([ans]);const span=Math.max(5,Math.round(Math.abs(ans)*.1)+5);while(s.size<4){let d=Math.floor(Math.random()*span*2-span);let v=ans+(d===0?1:d);if(Number.isFinite(v)&&v!==ans)s.add(v);}return shuffle([...s]);}
function confettiBurst(){for(let i=0;i<25;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=`hsl(${Math.random()*50+10} 90% 55%)`;p.style.transform=`translateY(-10px) rotate(${Math.random()*180}deg)`;fxEl.appendChild(p);setTimeout(()=>p.remove(),900);}}
function show(screen){[startScreen,gameScreen,resultScreen].forEach(e=>e.classList.remove('active'));screen.classList.add('active');}
function start(){playerName=$('#playerName').value||'ผู้เล่น';playerDisplay.textContent=playerName;order=[...Array(QUESTIONS.length).keys()];shuffle(order);idx=0;score=0;scoreEl.textContent=score;emojiFront.textContent='';load();show(gameScreen);} 
function load(){const item=QUESTIONS[order[idx]];qIndex.textContent=idx+1;qText.textContent=item.q;emojiFront.textContent='';options.innerHTML='';const c=makeChoices(item.a);c.forEach(v=>{const b=document.createElement('button');b.className='btn';b.textContent=v;b.onclick=()=>select(b,v===item.a);options.appendChild(b);});startTimer(15);}
function select(btn,ok){stopTimer();[...options.children].forEach(b=>b.disabled=true);if(ok){btn.classList.add('correct');score++;scoreEl.textContent=score;emojiFront.textContent=['🤩','😄','🎉'][Math.floor(Math.random()*3)];confettiBurst();}else{btn.classList.add('wrong');emojiFront.textContent=['😝','😂','😛'][Math.floor(Math.random()*3)];const item=QUESTIONS[order[idx]];[...options.children].forEach(b=>{if(+b.textContent===item.a)b.classList.add('correct');});}
setTimeout(next,700);}
function next(){idx++;if(idx>=QUESTIONS.length){end();}else{load();}}
function end(){finalScore.textContent=`${score}/${QUESTIONS.length}`;const msgList=['เด็กอะไร หัวไวยังกะจรวด 🚀','ว้าว! สุดปัง ปัง ปัง 🎯','เก่งจนคณิตยังยอม 😍','เร็วแบบนี้อนาคตนักวิทยาศาสตร์แน่!'];finalMsg.textContent=msgList[Math.floor(Math.random()*msgList.length)];show(resultScreen);}
function startTimer(s){timeLeft=s;secEl.textContent=timeLeft;barEl.style.transition='none';barEl.style.transform='scaleX(1)';setTimeout(()=>{barEl.style.transition=`transform ${s}s linear`;barEl.style.transform='scaleX(0)';},10);timer=setInterval(()=>{timeLeft--;secEl.textContent=timeLeft;if(timeLeft<=0)timeUp();},1000);}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function timeUp(){stopTimer();const item=QUESTIONS[order[idx]];[...options.children].forEach(b=>{b.disabled=true;if(+b.textContent===item.a)b.classList.add('correct');else b.classList.add('wrong');});emojiFront.textContent=['😝','😂','😛'][Math.floor(Math.random()*3)];setTimeout(next,700);}
$('#btnStart').addEventListener('click',start);$('#btnReplay').addEventListener('click',()=>show(startScreen));
</script>
</body>
</html>
